name: RepoPilot release dry run
on:
  workflow_dispatch:
  push:
    tags: ['repopilot-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/packaging/check_version.py
        env:
          REPOPILOT_RELEASE_REF: ${{ github.ref }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/packaging/check_wheel.py dist/*.whl
      - run: python -m venv /tmp/repopilot-wheel
      - run: /tmp/repopilot-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/repopilot-wheel/bin/python scripts/packaging/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: repopilot-runtime-dist
          path: dist/*
