name: Optional model service probe
on:
  workflow_dispatch:
    inputs:
      model:
        description: Explicit model ID (provider may charge for two requests)
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/packaging/external_probe.py
        env:
          REPOPILOT_MODEL: ${{ inputs.model }}
          REPOPILOT_API_KEY: ${{ secrets.REPOPILOT_API_KEY }}
          REPOPILOT_BASE_URL: ${{ vars.REPOPILOT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-probe
          path: external-probe.json
