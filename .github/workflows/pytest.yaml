name: RepoPilot tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: ruff check src/repopilot tests/repopilot scripts/packaging
      - run: pytest tests/repopilot -m 'not docker and not external' -q -rs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: docker build -t repopilot-benchmark:ci -f docker/benchmark/Dockerfile .
      - run: pytest tests/repopilot -m docker -q -rs
        env:
          REPOPILOT_DOCKER_TEST_IMAGE: repopilot-benchmark:ci
